name: image_to_pdf
description: Image text detection and PDF generation with ML Kit
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.4
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  flutter_pdfview: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true